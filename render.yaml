services:
  - type: web
    name: checklist-webapp
    env: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_FAST
        value: gemini-2.0-flash-001
      - key: GEMINI_MODEL_STRONG
        value: gemini-2.5-pro
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NEXTSTEP_INTERNAL_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
